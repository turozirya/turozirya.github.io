<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 543 360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>İsim kartı kodu: program başladığında Merhaba yazısı ve mutlu simge; her zaman bloğunda isim yazısı, kendi çizimin, duraklat, ekranı temizle ve duraklat blokları.</title>
<rect width="543" height="360" fill="#FFFFFF"/>
<text x="271" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">İsim Kartı</text>
<text x="30" y="76" font-size="13" font-weight="700" fill="#64748B">BİR KEZ ÇALIŞIR</text>
<rect x="30" y="126" width="18" height="84" fill="#1E90FF"/>
<rect x="30" y="90" width="210" height="42" rx="12" fill="#1E90FF"/>
<text x="44" y="116" font-size="14" fill="#FFFFFF">program başladığında</text>
<rect x="48" y="132" width="182" height="36" rx="6" fill="#1E90FF"/>
<text x="60" y="155" font-size="14" fill="#FFFFFF">dizgi göster</text>
<rect x="140" y="138" width="78" height="24" rx="12" fill="#FFFFFF"/>
<text x="179" y="155" text-anchor="middle" font-size="13" fill="#0F172A">&quot;Merhaba&quot;</text>
