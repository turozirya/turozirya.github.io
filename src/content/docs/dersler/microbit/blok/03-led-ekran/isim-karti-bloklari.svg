<text x="60" y="193" font-size="14" fill="#FFFFFF">simgeyi göster</text>
<rect x="159" y="176" width="50" height="24" rx="12" fill="#FFFFFF"/>
<text x="184" y="193" text-anchor="middle" font-size="13" fill="#0F172A">mutlu</text>
<rect x="30" y="208" width="126" height="18" rx="6" fill="#1E90FF"/>
<text x="276" y="76" font-size="13" font-weight="700" fill="#64748B">DURMADAN TEKRARLAR</text>
<rect x="276" y="126" width="18" height="198" fill="#1E90FF"/>
<rect x="276" y="90" width="237" height="42" rx="12" fill="#1E90FF"/>
<text x="290" y="116" font-size="14" fill="#FFFFFF">her zaman</text>
<rect x="294" y="132" width="209" height="36" rx="6" fill="#1E90FF"/>
<text x="306" y="155" font-size="14" fill="#FFFFFF">dizgi göster</text>
<rect x="385" y="138" width="51" height="24" rx="12" fill="#FFFFFF"/>
<text x="411" y="155" text-anchor="middle" font-size="13" fill="#0F172A">&quot;ELİF&quot;</text>
<rect x="294" y="170" width="209" height="36" rx="6" fill="#1E90FF"/>
<text x="306" y="193" font-size="14" fill="#FFFFFF">led&#x27;leri göster</text>
<rect x="398" y="176" width="92" height="24" rx="12" fill="#FFFFFF"/>
<text x="445" y="193" text-anchor="middle" font-size="13" fill="#0F172A">kendi çizimin</text>
<rect x="294" y="208" width="209" height="36" rx="6" fill="#1E90FF"/>
<text x="306" y="231" font-size="14" fill="#FFFFFF">duraklat (ms)</text>
<rect x="397" y="214" width="38" height="24" rx="12" fill="#FFFFFF"/>
<text x="416" y="231" text-anchor="middle" font-size="13" fill="#0F172A">500</text>
<rect x="294" y="246" width="209" height="36" rx="6" fill="#1E90FF"/>
<text x="306" y="269" font-size="14" fill="#FFFFFF">ekranı temizle</text>
<rect x="294" y="284" width="209" height="36" rx="6" fill="#1E90FF"/>
<text x="306" y="307" font-size="14" fill="#FFFFFF">duraklat (ms)</text>
<rect x="397" y="290" width="38" height="24" rx="12" fill="#FFFFFF"/>
<text x="416" y="307" text-anchor="middle" font-size="13" fill="#0F172A">500</text>
<rect x="276" y="322" width="142" height="18" rx="6" fill="#1E90FF"/>
</svg>
