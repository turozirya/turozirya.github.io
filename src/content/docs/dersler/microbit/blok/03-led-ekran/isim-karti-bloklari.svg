<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 653 366" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>İsim kartı kodu: başlangıçta Merhaba yazısı ve mutlu simge; sürekli bloğunda isim yazısı, kendi çizimin, duraklat, ekranı temizle ve duraklat blokları.</title>
<rect width="653" height="366" fill="#FFFFFF"/>
<text x="326" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">İsim Kartı</text>
<text x="30" y="76" font-size="13" font-weight="700" fill="#64748B">BIR KEZ ÇALIŞIR</text>
<rect x="30" y="90" width="247" height="42" rx="12" fill="#1E90FF"/><rect x="30" y="126" width="18" height="88" fill="#1E90FF"/><text x="44" y="116.0" font-size="14" fill="#FFFFFF" xml:space="preserve">başlangıçta</text><rect x="48" y="132" width="219" height="36" rx="6" fill="#1E90FF"/><text x="60" y="155.0" font-size="14" fill="#FFFFFF" xml:space="preserve">yazı göster </text><rect x="159" y="138.0" width="86" height="24" rx="12" fill="#FFFFFF"/><text x="202" y="155.0" text-anchor="middle" font-size="13" fill="#0F172A">"Merhaba"</text><rect x="48" y="170" width="219" height="36" rx="6" fill="#1E90FF"/><text x="60" y="193.0" font-size="14" fill="#FFFFFF" xml:space="preserve">simge göster </text><rect x="168" y="176.0" width="56" height="24" rx="12" fill="#FFFFFF"/><text x="195" y="193.0" text-anchor="middle" font-size="13" fill="#0F172A">mutlu</text><rect x="30" y="208" width="148" height="18" rx="6" fill="#1E90FF"/>
<text x="313" y="76" font-size="13" font-weight="700" fill="#64748B">DURMADAN TEKRARLAR</text>
