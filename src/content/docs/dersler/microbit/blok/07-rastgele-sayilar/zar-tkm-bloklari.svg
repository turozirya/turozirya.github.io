<text x="78" y="531" font-size="14" fill="#FFFFFF">değilse</text>
<rect x="84" y="542" width="357" height="36" rx="6" fill="#1E90FF"/>
<text x="96" y="565" font-size="14" fill="#FFFFFF">led&#x27;leri göster</text>
<rect x="189" y="548" width="54" height="24" rx="12" fill="#FFFFFF"/>
<text x="216" y="565" text-anchor="middle" font-size="13" fill="#0F172A">makas</text>
