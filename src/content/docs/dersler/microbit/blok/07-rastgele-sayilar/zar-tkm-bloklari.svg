<text x="363" y="311" font-size="14" fill="#FFFFFF">ila</text>
<rect x="384" y="294" width="26" height="24" rx="12" fill="#FFFFFF"/>
<text x="397" y="311" text-anchor="middle" font-size="13" fill="#0F172A">3</text>
<text x="426" y="311" font-size="14" fill="#FFFFFF">yap</text>
<rect x="48" y="358" width="18" height="244" fill="#00A4A6"/>
<rect x="48" y="326" width="413" height="38" rx="6" fill="#00A4A6"/>
