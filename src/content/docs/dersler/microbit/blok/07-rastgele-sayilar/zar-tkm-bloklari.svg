<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 648" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Zar kodu: sallandığında 1 ile 6 arasında rastgele sayı gösterilir. Taş-kâğıt-makas kodu: sallandığında seçim değişkenine 1 ile 3 arasında rastgele sayı atanır; 1 ise taş, 2 ise kâğıt, değilse makas deseni gösterilir.</title>
<rect width="600" height="648" fill="#FFFFFF"/>
<text x="300" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Zar ve Taş-Kâğıt-Makas</text>
<text x="101" y="76" font-size="13" font-weight="700" fill="#64748B">ELEKTRONIK ZAR</text>
<rect x="101" y="90" width="398" height="42" rx="12" fill="#D400D4"/><rect x="101" y="126" width="18" height="50" fill="#D400D4"/><text x="115" y="116.0" font-size="14" fill="#FFFFFF" xml:space="preserve">sallandığında</text><rect x="119" y="132" width="370" height="36" rx="6" fill="#1E90FF"/><text x="131" y="155.0" font-size="14" fill="#FFFFFF" xml:space="preserve">sayı göster </text><rect x="230" y="138.0" width="237" height="24" rx="12" fill="#FFFFFF"/><text x="349" y="155.0" text-anchor="middle" font-size="13" fill="#0F172A">1 ile 6 arasında rastgele seç</text><rect x="101" y="170" width="239" height="18" rx="6" fill="#D400D4"/>
<text x="72" y="220" font-size="13" font-weight="700" fill="#64748B">TAŞ-KÂĞIT-MAKAS</text>
<rect x="72" y="234" width="457" height="42" rx="12" fill="#D400D4"/><rect x="72" y="270" width="18" height="340" fill="#D400D4"/><text x="86" y="260.0" font-size="14" fill="#FFFFFF" xml:space="preserve">sallandığında</text><rect x="90" y="276" width="429" height="36" rx="6" fill="#DC143C"/><text x="102" y="299.0" font-size="14" fill="#FFFFFF" xml:space="preserve">seçim değerini </text><rect x="226" y="282.0" width="237" height="24" rx="12" fill="#FFFFFF"/><text x="344" y="299.0" text-anchor="middle" font-size="13" fill="#0F172A">1 ile 3 arasında rastgele seç</text><text x="468" y="299.0" font-size="14" fill="#FFFFFF" xml:space="preserve"> yap</text><rect x="90" y="314" width="429" height="38" rx="6" fill="#00A4A6"/><rect x="90" y="346" width="18" height="50" fill="#00A4A6"/><text x="102" y="338.0" font-size="14" fill="#FFFFFF" xml:space="preserve">eğer </text><rect x="145" y="321.0" width="86" height="24" rx="12" fill="#FFFFFF"/><text x="188" y="338.0" text-anchor="middle" font-size="13" fill="#0F172A">seçim = 1</text><text x="236" y="338.0" font-size="14" fill="#FFFFFF" xml:space="preserve"> ise</text><rect x="108" y="352" width="401" height="36" rx="6" fill="#1E90FF"/><text x="120" y="375.0" font-size="14" fill="#FFFFFF" xml:space="preserve">LED'leri göster </text><rect x="252" y="358.0" width="41" height="24" rx="12" fill="#FFFFFF"/><text x="272" y="375.0" text-anchor="middle" font-size="13" fill="#0F172A">taş</text><rect x="90" y="390" width="257" height="32" rx="6" fill="#00A4A6"/><text x="102" y="411" font-size="14" fill="#FFFFFF">değilse</text><rect x="90" y="416" width="18" height="176" fill="#00A4A6"/><rect x="108" y="422" width="401" height="38" rx="6" fill="#00A4A6"/><rect x="108" y="454" width="18" height="50" fill="#00A4A6"/><text x="120" y="446.0" font-size="14" fill="#FFFFFF" xml:space="preserve">eğer </text><rect x="163" y="429.0" width="86" height="24" rx="12" fill="#FFFFFF"/><text x="206" y="446.0" text-anchor="middle" font-size="13" fill="#0F172A">seçim = 2</text><text x="254" y="446.0" font-size="14" fill="#FFFFFF" xml:space="preserve"> ise</text><rect x="126" y="460" width="373" height="36" rx="6" fill="#1E90FF"/><text x="138" y="483.0" font-size="14" fill="#FFFFFF" xml:space="preserve">LED'leri göster </text><rect x="270" y="466.0" width="56" height="24" rx="12" fill="#FFFFFF"/><text x="298" y="483.0" text-anchor="middle" font-size="13" fill="#0F172A">kâğıt</text><rect x="108" y="498" width="241" height="32" rx="6" fill="#00A4A6"/><text x="120" y="519" font-size="14" fill="#FFFFFF">değilse</text><rect x="108" y="524" width="18" height="50" fill="#00A4A6"/><rect x="126" y="530" width="373" height="36" rx="6" fill="#1E90FF"/><text x="138" y="553.0" font-size="14" fill="#FFFFFF" xml:space="preserve">LED'leri göster </text><rect x="270" y="536.0" width="56" height="24" rx="12" fill="#FFFFFF"/><text x="298" y="553.0" text-anchor="middle" font-size="13" fill="#0F172A">makas</text><rect x="108" y="568" width="241" height="18" rx="6" fill="#00A4A6"/><rect x="90" y="586" width="257" height="18" rx="6" fill="#00A4A6"/><rect x="72" y="604" width="274" height="18" rx="6" fill="#D400D4"/>
</svg>