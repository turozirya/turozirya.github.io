<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 501 658" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Zar kodu: salla ise 1 ila 6 arasında rastgele sayı gösterilir. Taş-kâğıt-makas kodu: salla ise seçim değişkenine 1 ila 3 arasında rastgele sayı atanır; 1 ise taş, 2 ise kâğıt, değilse makas deseni gösterilir.</title>
<rect width="501" height="658" fill="#FFFFFF"/>
<text x="250" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Zar ve Taş-Kâğıt-Makas</text>
<text x="61" y="76" font-size="13" font-weight="700" fill="#64748B">ELEKTRONİK ZAR</text>
<rect x="61" y="126" width="18" height="46" fill="#D400D4"/>
<rect x="61" y="90" width="380" height="42" rx="12" fill="#D400D4"/>
<text x="75" y="116" font-size="14" fill="#FFFFFF">salla ise</text>
<rect x="79" y="132" width="352" height="36" rx="6" fill="#1E90FF"/>
