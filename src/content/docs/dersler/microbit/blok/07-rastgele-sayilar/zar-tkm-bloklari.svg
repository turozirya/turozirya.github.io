<text x="395" y="155" text-anchor="middle" font-size="13" fill="#0F172A">6</text>
<rect x="61" y="170" width="228" height="18" rx="6" fill="#D400D4"/>
<text x="30" y="232" font-size="13" font-weight="700" fill="#64748B">TAŞ-KÂĞIT-MAKAS</text>
<rect x="30" y="282" width="18" height="340" fill="#D400D4"/>
<rect x="30" y="246" width="441" height="42" rx="12" fill="#D400D4"/>
