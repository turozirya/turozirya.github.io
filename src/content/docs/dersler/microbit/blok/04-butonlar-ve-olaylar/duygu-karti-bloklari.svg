<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 208" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Duygu kartı kodu: A tuşuna basıldığında mutlu simge, B tuşuna basıldığında üzgün simge, A+B tuşuna basıldığında kalp simgesi gösterilir.</title>
<rect width="728" height="208" fill="#FFFFFF"/>
<text x="364" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Duygu Gösteren Kart</text>
<rect x="30" y="126" width="18" height="46" fill="#D400D4"/>
<rect x="30" y="90" width="201" height="42" rx="12" fill="#D400D4"/>
<text x="44" y="116" font-size="14" fill="#FFFFFF">A tuşuna basıldığında</text>
<rect x="48" y="132" width="173" height="36" rx="6" fill="#1E90FF"/>
<text x="60" y="155" font-size="14" fill="#FFFFFF">simgeyi göster</text>
<rect x="159" y="138" width="50" height="24" rx="12" fill="#FFFFFF"/>
<text x="184" y="155" text-anchor="middle" font-size="13" fill="#0F172A">mutlu</text>
<rect x="30" y="170" width="121" height="18" rx="6" fill="#D400D4"/>
<rect x="267" y="126" width="18" height="46" fill="#D400D4"/>
<rect x="267" y="90" width="203" height="42" rx="12" fill="#D400D4"/>
<text x="281" y="116" font-size="14" fill="#FFFFFF">B tuşuna basıldığında</text>
<rect x="285" y="132" width="175" height="36" rx="6" fill="#1E90FF"/>
<text x="297" y="155" font-size="14" fill="#FFFFFF">simgeyi göster</text>
<rect x="396" y="138" width="52" height="24" rx="12" fill="#FFFFFF"/>
<text x="422" y="155" text-anchor="middle" font-size="13" fill="#0F172A">üzgün</text>
<rect x="267" y="170" width="122" height="18" rx="6" fill="#D400D4"/>
<rect x="506" y="126" width="18" height="46" fill="#D400D4"/>
<rect x="506" y="90" width="192" height="42" rx="12" fill="#D400D4"/>
<text x="520" y="116" font-size="14" fill="#FFFFFF">A+B tuşuna basıldığında</text>
<rect x="524" y="132" width="164" height="36" rx="6" fill="#1E90FF"/>
<text x="536" y="155" font-size="14" fill="#FFFFFF">simgeyi göster</text>
<rect x="635" y="138" width="40" height="24" rx="12" fill="#FFFFFF"/>
<text x="656" y="155" text-anchor="middle" font-size="13" fill="#0F172A">kalp</text>
<rect x="506" y="170" width="120" height="18" rx="6" fill="#D400D4"/>
</svg>
