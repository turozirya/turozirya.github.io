<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 214" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Duygu kartı kodu: A düğmesine basıldığında mutlu simge, B düğmesine basıldığında üzgün simge, A+B düğmesine basıldığında kalp simgesi gösterilir.</title>
<rect width="828" height="214" fill="#FFFFFF"/>
<text x="414" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Duygu Gösteren Kart</text>
<rect x="30" y="90" width="227" height="42" rx="12" fill="#D400D4"/><rect x="30" y="126" width="18" height="50" fill="#D400D4"/><text x="44" y="116.0" font-size="14" fill="#FFFFFF" xml:space="preserve">A düğmesine basıldığında</text><rect x="48" y="132" width="199" height="36" rx="6" fill="#1E90FF"/><text x="60" y="155.0" font-size="14" fill="#FFFFFF" xml:space="preserve">simge göster </text><rect x="168" y="138.0" width="56" height="24" rx="12" fill="#FFFFFF"/><text x="195" y="155.0" text-anchor="middle" font-size="13" fill="#0F172A">mutlu</text><rect x="30" y="170" width="136" height="18" rx="6" fill="#D400D4"/>
<rect x="292" y="90" width="227" height="42" rx="12" fill="#D400D4"/><rect x="292" y="126" width="18" height="50" fill="#D400D4"/><text x="306" y="116.0" font-size="14" fill="#FFFFFF" xml:space="preserve">B düğmesine basıldığında</text><rect x="310" y="132" width="199" height="36" rx="6" fill="#1E90FF"/><text x="322" y="155.0" font-size="14" fill="#FFFFFF" xml:space="preserve">simge göster </text><rect x="430" y="138.0" width="56" height="24" rx="12" fill="#FFFFFF"/><text x="457" y="155.0" text-anchor="middle" font-size="13" fill="#0F172A">üzgün</text><rect x="292" y="170" width="136" height="18" rx="6" fill="#D400D4"/>
<rect x="555" y="90" width="243" height="42" rx="12" fill="#D400D4"/><rect x="555" y="126" width="18" height="50" fill="#D400D4"/><text x="569" y="116.0" font-size="14" fill="#FFFFFF" xml:space="preserve">A+B düğmesine basıldığında</text><rect x="573" y="132" width="215" height="36" rx="6" fill="#1E90FF"/><text x="585" y="155.0" font-size="14" fill="#FFFFFF" xml:space="preserve">simge göster </text><rect x="693" y="138.0" width="48" height="24" rx="12" fill="#FFFFFF"/><text x="717" y="155.0" text-anchor="middle" font-size="13" fill="#0F172A">kalp</text><rect x="555" y="170" width="146" height="18" rx="6" fill="#D400D4"/>
</svg>