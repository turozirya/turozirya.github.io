<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Üç döngü türü: sürekli hiç durmaz; tekrarla belli sayıda tekrar edip devam eder; iken koşul doğru oldukça tekrar eder, koşul yanlış olunca biter.</title>
  <defs>
    <marker id="okl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#FFFFFF"/>
  <text x="450" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Üç Çeşit Döngü</text>

  <g fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2">
    <rect x="30" y="62" width="270" height="336" rx="14"/>
    <rect x="315" y="62" width="270" height="336" rx="14"/>
    <rect x="600" y="62" width="270" height="336" rx="14"/>
  </g>
  <g font-size="20" font-weight="700" fill="#00AA00" text-anchor="middle">
    <text x="165" y="96">sürekli</text>
    <text x="450" y="96">tekrarla 4 kez</text>
    <text x="735" y="96">iken</text>
  </g>
  <g font-size="13" fill="#64748B" text-anchor="middle">
    <text x="165" y="118">Kart açık oldukça hiç durmaz</text>
    <text x="450" y="118">Belli sayıda tekrar eder</text>
    <text x="735" y="118">Koşul doğru oldukça sürer</text>
  </g>

  <!-- sürekli -->
  <rect x="85" y="160" width="160" height="44" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="165" y="188" text-anchor="middle" font-size="15" fill="#0F172A">Kalp göster</text>
  <path d="M245 182 H272 V142 H165 V156" stroke="#00AA00" stroke-width="2.5" fill="none" marker-end="url(#okl)"/>
  <text x="165" y="262" text-anchor="middle" font-size="15" fill="#0F172A">Tekrar, tekrar, tekrar…</text>
  <text x="165" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#B91C1C">Çıkış yok</text>

  <!-- tekrarla -->
  <rect x="370" y="160" width="160" height="44" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="450" y="188" text-anchor="middle" font-size="15" fill="#0F172A">Kalp göster</text>
  <path d="M530 182 H557 V142 H450 V156" stroke="#00AA00" stroke-width="2.5" fill="none" marker-end="url(#okl)"/>
  <text x="470" y="136" font-size="13" font-weight="700" fill="#00AA00">4 kez</text>
  <line x1="450" y1="204" x2="450" y2="238" stroke="#475569" stroke-width="2.5" marker-end="url(#okl)"/>
  <rect x="370" y="242" width="160" height="44" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="450" y="270" text-anchor="middle" font-size="15" fill="#0F172A">Sonraki bloğa geç</text>
  <text x="450" y="334" text-anchor="middle" font-size="15" fill="#0F172A">1, 2, 3, 4… sonra çıkar</text>

  <!-- iken -->
  <polygon points="735,140 805,174 735,208 665,174" fill="#FFEDD5" stroke="#EA580C" stroke-width="2.5"/>
  <text x="735" y="179" text-anchor="middle" font-size="14" fill="#0F172A">sayı &gt; 0?</text>
  <line x1="735" y1="208" x2="735" y2="238" stroke="#475569" stroke-width="2.5" marker-end="url(#okl)"/>
  <text x="745" y="228" font-size="13" font-weight="700" fill="#15803D">Evet</text>
  <rect x="645" y="242" width="180" height="44" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="735" y="270" text-anchor="middle" font-size="14" fill="#0F172A">Göster, 1 azalt</text>
  <path d="M645 264 H624 V174 H661" stroke="#00AA00" stroke-width="2.5" fill="none" marker-end="url(#okl)"/>
  <path d="M805 174 H846 V330" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#okl)"/>
  <text x="812" y="164" font-size="13" font-weight="700" fill="#B91C1C">Hayır</text>
  <text x="836" y="356" text-anchor="end" font-size="15" font-weight="700" fill="#0F172A">Döngü biter</text>
</svg>
