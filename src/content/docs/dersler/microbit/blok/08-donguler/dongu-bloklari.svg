<rect x="361" y="246" width="212" height="36" rx="6" fill="#1E90FF"/>
<text x="373" y="269" font-size="14" fill="#FFFFFF">duraklat (ms)</text>
<rect x="464" y="252" width="46" height="24" rx="12" fill="#FFFFFF"/>
<text x="487" y="269" text-anchor="middle" font-size="13" fill="#0F172A">1000</text>
