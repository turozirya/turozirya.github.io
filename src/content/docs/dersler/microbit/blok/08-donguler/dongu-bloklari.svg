<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 623 418" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Tekrarla örneği: A&#x27;ya basınca kare ve küçük kare simgeleri 3 kez gösterilir, sonra ekran temizlenir. Olduğunda örneği: B&#x27;ye basınca sayı 5 yapılır; sayı 0&#x27;dan büyük oldukça sayı gösterilir, 1 saniye beklenir ve sayı 1 azaltılır; sonunda evet simgesi gösterilir.</title>
<rect width="623" height="418" fill="#FFFFFF"/>
