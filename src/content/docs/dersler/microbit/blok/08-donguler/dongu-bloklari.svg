<text x="78" y="193" font-size="14" fill="#FFFFFF">simgeyi göster</text>
<rect x="177" y="176" width="41" height="24" rx="12" fill="#FFFFFF"/>
<text x="198" y="193" text-anchor="middle" font-size="13" fill="#0F172A">kare</text>
<rect x="66" y="208" width="203" height="36" rx="6" fill="#1E90FF"/>
<text x="78" y="231" font-size="14" fill="#FFFFFF">simgeyi göster</text>
<rect x="177" y="214" width="80" height="24" rx="12" fill="#FFFFFF"/>
<text x="217" y="231" text-anchor="middle" font-size="13" fill="#0F172A">küçük kare</text>
<rect x="48" y="246" width="139" height="18" rx="6" fill="#00AA00"/>
<rect x="48" y="266" width="231" height="36" rx="6" fill="#1E90FF"/>
<text x="60" y="289" font-size="14" fill="#FFFFFF">ekranı temizle</text>
<rect x="30" y="304" width="155" height="18" rx="6" fill="#D400D4"/>
<text x="325" y="76" font-size="13" font-weight="700" fill="#64748B">OLDUĞUNDA: GERİ SAYIM</text>
