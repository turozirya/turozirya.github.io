<rect x="343" y="132" width="240" height="36" rx="6" fill="#DC143C"/>
<text x="355" y="155" font-size="14" fill="#FFFFFF">sayı değişkenini</text>
<rect x="461" y="138" width="26" height="24" rx="12" fill="#FFFFFF"/>
<text x="474" y="155" text-anchor="middle" font-size="13" fill="#0F172A">5</text>
<text x="493" y="155" font-size="14" fill="#FFFFFF">yap</text>
<rect x="343" y="202" width="18" height="122" fill="#00AA00"/>
<rect x="343" y="170" width="240" height="38" rx="6" fill="#00AA00"/>
<rect x="355" y="177" width="64" height="24" rx="12" fill="#FFFFFF"/>
<text x="387" y="194" text-anchor="middle" font-size="13" fill="#0F172A">sayı &gt; 0</text>
