<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 422" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Tekrarla örneği: A'ya basınca kare ve küçük kare simgeleri 3 kez gösterilir, sonra ekran temizlenir. İken örneği: B'ye basınca sayı 5 yapılır; sayı 0'dan büyük oldukça sayı gösterilir, 1 saniye beklenir ve sayı 1 azaltılır; sonunda evet simgesi gösterilir.</title>
