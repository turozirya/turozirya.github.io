  <circle cx="100" cy="292" r="14" fill="#FFFFFF" stroke="#94A3B8"/>
  <path d="M95 284 L107 292 L95 300 Z" fill="#475569"/>
  <circle cx="140" cy="292" r="14" fill="#FFFFFF" stroke="#94A3B8"/>
  <rect x="134" y="286" width="12" height="12" fill="#475569"/>
