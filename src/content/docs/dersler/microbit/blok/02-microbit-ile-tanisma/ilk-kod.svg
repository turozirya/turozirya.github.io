<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>İlk kod: program başladığında kalp simgesi göster; blok, MicroPython ve sonuç</title>
  <defs>
    <marker id="ok5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <pattern id="dim" x="715" y="82" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="8" y="6" width="8" height="12" rx="1" fill="#4B1113"/>
    </pattern>
  </defs>
  <rect width="900" height="240" fill="#FFFFFF"/>
  <text x="450" y="30" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">İlk Kodumuz: Kalp Göster</text>

  <g font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">
    <text x="160" y="66">BLOK</text>
    <text x="480" y="66">MICROPYTHON</text>
    <text x="775" y="62">SONUÇ</text>
  </g>

  <!-- Blok -->
  <rect x="40" y="82" width="240" height="100" rx="8" fill="#1E90FF"/>
  <text x="58" y="108" font-size="15" font-weight="700" fill="#FFFFFF">program başladığında</text>
  <rect x="58" y="124" width="200" height="38" rx="5" fill="#4C9BE8" stroke="#1873CC"/>
  <text x="72" y="148" font-size="14" fill="#FFFFFF">simgeyi göster ♥</text>

  <text x="305" y="141" text-anchor="middle" font-size="28" font-weight="700" fill="#94A3B8">=</text>

  <!-- Python -->
  <rect x="330" y="82" width="300" height="100" rx="8" fill="#0F172A"/>
  <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#E2E8F0">
    <text x="348" y="122">from microbit import *</text>
    <text x="348" y="152">display.show(Image.HEART)</text>
  </g>

  <line x1="640" y1="132" x2="690" y2="132" stroke="#475569" stroke-width="2.5" marker-end="url(#ok5)"/>

  <!-- Sonuç -->
  <rect x="700" y="72" width="150" height="140" rx="12" fill="#1F2937"/>
  <rect x="715" y="82" width="120" height="120" fill="url(#dim)"/>
  <g fill="#EF4444">
    <rect x="747" y="88" width="8" height="12" rx="1"/><rect x="795" y="88" width="8" height="12" rx="1"/>
    <rect x="723" y="112" width="8" height="12" rx="1"/><rect x="747" y="112" width="8" height="12" rx="1"/><rect x="771" y="112" width="8" height="12" rx="1"/><rect x="795" y="112" width="8" height="12" rx="1"/><rect x="819" y="112" width="8" height="12" rx="1"/>
    <rect x="723" y="136" width="8" height="12" rx="1"/><rect x="747" y="136" width="8" height="12" rx="1"/><rect x="771" y="136" width="8" height="12" rx="1"/><rect x="795" y="136" width="8" height="12" rx="1"/><rect x="819" y="136" width="8" height="12" rx="1"/>
    <rect x="747" y="160" width="8" height="12" rx="1"/><rect x="771" y="160" width="8" height="12" rx="1"/><rect x="795" y="160" width="8" height="12" rx="1"/>
    <rect x="771" y="184" width="8" height="12" rx="1"/>
  </g>
</svg>
