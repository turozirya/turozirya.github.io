<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 933 610" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Puan tabelası kodu: başlangıçta puan 0; A'ya basınca puan 1 artar, B'ye basınca 1 azalır; sürekli bloğunda puan 5 veya fazlaysa mutlu yüz, 0'dan küçükse üzgün yüz, değilse puan gösterilir.</title>
