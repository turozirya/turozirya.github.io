<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 843 620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Puan tabelası kodu: program başladığında puan 0; A&#x27;ya basınca puan 1 artar, B&#x27;ye basınca 1 azalır; her zaman bloğunda puan 5 veya fazlaysa mutlu yüz, 0&#x27;dan küçükse üzgün yüz, değilse puan gösterilir.</title>
