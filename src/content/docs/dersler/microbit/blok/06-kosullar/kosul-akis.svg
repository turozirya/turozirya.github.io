<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Puan tabelasının karar akışı: puan 5 veya fazlaysa mutlu yüz; değilse puan 0'dan küçükse üzgün yüz; değilse puan sayı olarak gösterilir.</title>
  <defs>
    <marker id="okk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="540" fill="#FFFFFF"/>
  <text x="380" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Puan Tabelası Nasıl Karar Verir?</text>

  <rect x="170" y="68" width="180" height="46" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="260" y="97" text-anchor="middle" font-size="16" fill="#0F172A">Puana bak</text>

  <polygon points="260,138 370,190 260,242 150,190" fill="#FFEDD5" stroke="#EA580C" stroke-width="2.5"/>
  <text x="260" y="196" text-anchor="middle" font-size="16" fill="#0F172A">puan ≥ 5 mi?</text>

  <polygon points="260,288 370,340 260,392 150,340" fill="#FFEDD5" stroke="#EA580C" stroke-width="2.5"/>
  <text x="260" y="346" text-anchor="middle" font-size="16" fill="#0F172A">puan &lt; 0 mı?</text>

  <g fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5">
    <rect x="470" y="166" width="220" height="48" rx="4"/>
    <rect x="470" y="316" width="220" height="48" rx="4"/>
    <rect x="130" y="438" width="260" height="48" rx="4"/>
  </g>
  <g font-size="16" text-anchor="middle" fill="#0F172A">
    <text x="580" y="196">Mutlu yüz göster</text>
    <text x="580" y="346">Üzgün yüz göster</text>
    <text x="260" y="468">Puanı sayı olarak göster</text>
  </g>

  <g stroke="#475569" stroke-width="2.5" fill="none">
    <line x1="260" y1="114" x2="260" y2="134" marker-end="url(#okk)"/>
    <line x1="370" y1="190" x2="466" y2="190" marker-end="url(#okk)"/>
    <line x1="260" y1="242" x2="260" y2="284" marker-end="url(#okk)"/>
    <line x1="370" y1="340" x2="466" y2="340" marker-end="url(#okk)"/>
    <line x1="260" y1="392" x2="260" y2="434" marker-end="url(#okk)"/>
  </g>
  <g font-size="15" font-weight="700">
    <text x="396" y="180" fill="#15803D">Evet</text>
    <text x="396" y="330" fill="#15803D">Evet</text>
    <text x="272" y="270" fill="#B91C1C">Hayır</text>
    <text x="272" y="420" fill="#B91C1C">Hayır</text>
  </g>

  <text x="380" y="520" text-anchor="middle" font-size="15" fill="#334155">her zaman bloğu bu kontrolü durmadan tekrarlar.</text>
</svg>
