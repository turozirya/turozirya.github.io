<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Akış şeması örneği: Şemsiye almalı mıyım?</title>
  <defs>
    <marker id="ok3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="600" height="620" fill="#FFFFFF"/>
  <text x="300" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Şemsiye Almalı mıyım?</text>

  <!-- Başla -->
  <rect x="220" y="62" width="160" height="48" rx="24" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="300" y="92" text-anchor="middle" font-size="17" fill="#0F172A">Başla</text>

  <!-- Hava durumuna bak (giriş) -->
  <polygon points="215,150 405,150 385,200 195,200" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
  <text x="300" y="181" text-anchor="middle" font-size="16" fill="#0F172A">Hava durumuna bak</text>

  <!-- Karar -->
  <polygon points="300,236 400,286 300,336 200,286" fill="#FFEDD5" stroke="#EA580C" stroke-width="2.5"/>
  <text x="300" y="282" text-anchor="middle" font-size="15" fill="#0F172A">Yağmur</text>
  <text x="300" y="301" text-anchor="middle" font-size="15" fill="#0F172A">yağıyor mu?</text>

  <!-- Şemsiye al -->
  <rect x="220" y="380" width="160" height="48" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="300" y="410" text-anchor="middle" font-size="16" fill="#0F172A">Şemsiye al</text>

  <!-- Dışarı çık -->
  <rect x="220" y="466" width="160" height="48" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="300" y="496" text-anchor="middle" font-size="16" fill="#0F172A">Dışarı çık</text>

  <!-- Bitir -->
  <rect x="220" y="552" width="160" height="48" rx="24" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="300" y="582" text-anchor="middle" font-size="17" fill="#0F172A">Bitir</text>

  <!-- Oklar -->
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <line x1="300" y1="110" x2="300" y2="146" marker-end="url(#ok3)"/>
    <line x1="300" y1="200" x2="300" y2="232" marker-end="url(#ok3)"/>
    <line x1="300" y1="336" x2="300" y2="376" marker-end="url(#ok3)"/>
    <line x1="300" y1="428" x2="300" y2="462" marker-end="url(#ok3)"/>
    <path d="M400 286 H480 V490 H384" marker-end="url(#ok3)"/>
    <line x1="300" y1="514" x2="300" y2="548" marker-end="url(#ok3)"/>
  </g>
  <text x="312" y="362" font-size="15" font-weight="700" fill="#15803D">Evet</text>
  <text x="420" y="276" font-size="15" font-weight="700" fill="#B91C1C">Hayır</text>
</svg>
